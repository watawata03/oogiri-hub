<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Oogiri Hub - お題一覧</title>
</head>
<body>
    <h1>🎭 Oogiri Hub</h1>
    
    <!-- ★ここを追加 -->
    <p>
        {% if user.is_authenticated %}
            <a href="{% url 'battles:topic_create' %}">✏️ 新しいお題を投稿する</a> (ログイン中: {{ user.username }})
        {% else %}
            <a href="{% url 'admin:login' %}">ログインする</a>
        {% endif %}
    </p>

    <hr>

    <h2>みんなのお題一覧</h2>
<ul>
        {% for topic in topics %}
            <li>
                <!-- ★ aタグで詳細ページへのリンクを設定 -->
                <a href="{% url 'battles:topic_detail' topic.pk %}">
                    <strong>{{ topic.title }}</strong>
                </a>
                (投稿者: {{ topic.creator.username }})
            </li>
        {% empty %}
            <li>まだお題がありません。</li>
        {% endfor %}
    </ul>
